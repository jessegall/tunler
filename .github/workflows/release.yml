name: release

# On a v* tag: publish the multi-arch server image to GHCR and attach the
# cross-compiled client binaries to a GitHub Release. The two are independent
# jobs so a hiccup in one doesn't block the other.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create releases
  packages: write # push to ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build client binaries
        run: make release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tunler-*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
