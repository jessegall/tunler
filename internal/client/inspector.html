<!doctype html>
<meta charset="utf-8">
<title>tunler inspector</title>
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #101418; color: #d6dde4; margin: 0; display: flex; height: 100vh; }
  #list { width: 46%; overflow-y: auto; border-right: 1px solid #2a3240; }
  #detail { flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid #1d242c; }
  th { position: sticky; top: 0; background: #151b22; color: #8b98a5; font-weight: 600; }
  tr:hover { background: #182028; cursor: pointer; }
  tr.sel { background: #1e2a36; }
  .m { color: #6cb6ff; } .ok { color: #57d996; } .err { color: #ff7b72; } .h { color: #8b98a5; }
  h1 { font-size: 14px; margin: 0; padding: 10px 12px; background: #151b22; border-bottom: 1px solid #1d242c; }
  h2 { font-size: 12px; color: #8b98a5; margin: 18px 0 6px; text-transform: uppercase; }
</style>
<div id="list">
  <h1>tunler inspector</h1>
  <table><thead><tr><th>time</th><th>method</th><th>path</th><th>status</th><th>dur</th><th>size</th></tr></thead>
  <tbody id="rows"></tbody></table>
</div>
<div id="detail"><span class="h">select a request…</span></div>
<script>
let sel = null;
async function refresh() {
  const rows = await (await fetch('/api/exchanges')).json() || [];
  const tb = document.getElementById('rows');
  tb.innerHTML = rows.slice().reverse().map(r =>
    '<tr data-id="' + r.id + '"' + (r.id === sel ? ' class="sel"' : '') + '>' +
    '<td class="h">' + r.time + '</td><td class="m">' + r.method + '</td>' +
    '<td>' + esc(r.path) + '</td>' +
    '<td class="' + (r.status < 400 ? 'ok' : 'err') + '">' + (r.done ? r.status : '…') + '</td>' +
    '<td class="h">' + (r.done ? r.duration : '') + '</td><td class="h">' + (r.done ? r.size : '') + '</td></tr>'
  ).join('');
  for (const tr of tb.querySelectorAll('tr')) tr.onclick = () => show(+tr.dataset.id);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function hdrs(h) { return Object.entries(h || {}).map(([k,v]) => k + ': ' + v.join(', ')).join('\n'); }
async function show(id) {
  sel = id;
  const e = await (await fetch('/api/exchange?id=' + id)).json();
  document.getElementById('detail').innerHTML =
    '<h2>' + e.method + ' ' + esc(e.path) + ' → ' + e.status + ' (' + e.duration + ')</h2>' +
    '<h2>request headers</h2>' + esc(hdrs(e.req_header)) +
    '<h2>request body (' + e.req_size + 'B)</h2>' + (esc(e.req_body) || '<span class="h">empty</span>') +
    '<h2>response headers</h2>' + esc(hdrs(e.resp_header)) +
    '<h2>response body (' + e.resp_size + 'B)</h2>' + (esc(e.resp_body) || '<span class="h">empty</span>');
  refresh();
}
refresh(); setInterval(refresh, 1000);
</script>
